<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Sổ Thu Chi</title>
  <meta name="description" content="Quản lý thu chi cá nhân, chạy offline">
  <meta name="theme-color" id="theme-color" content="#1f6feb">
  <script>
    // Áp chế độ sáng/tối trước khi vẽ để không bị nháy màn hình: 7:00–20:00 sáng, 20:00–7:00 tối.
    try {
      // Chế độ gọn (Cài đặt chung): áp trước khi vẽ để không bị nháy.
      if (localStorage.getItem('stc-compact') === '1') document.documentElement.classList.add('compact');
      var h = new Date().getHours();
      if (h >= 20 || h < 7) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-color').content = '#0d1117';
      }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thu Chi">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="main" class="main"></main>
    <!-- v7.67: thanh điều hướng dưới cố định ở mọi màn hình -->
    <nav class="tabbar" id="tabbar">
      <!-- v7.70: Tổng quan / Kế hoạch: 🏠 Tổng quan · ＋ · 🎯 Kế hoạch. Trong một tài khoản: 📒 Giao dịch · 📊 Báo cáo · ⚙️ Cài đặt -->
      <a href="#/home" data-tab="home" data-zone="main"><span class="ti">🏠</span><span>Tổng quan</span></a>
      <button type="button" class="tb-add" data-act="add" data-zone="main" aria-label="Thêm giao dịch"><span>＋</span></button>
      <a href="#/plan" data-tab="plan" data-zone="main"><span class="ti">🎯</span><span>Kế hoạch</span></a>
      <a href="#/tx" data-tab="tx" data-zone="book"><span class="ti">📒</span><span>Giao dịch</span></a>
      <!-- v7.81 (K1): trong tài khoản, nút ＋ nằm giữa thanh dưới giống Tổng quan (bỏ nút ＋ tròn lơ lửng ở đầu trang) -->
      <button type="button" class="tb-add" data-act="add" data-zone="book" aria-label="Thêm giao dịch"><span>＋</span></button>
      <a href="#/reports" data-tab="reports" data-zone="book"><span class="ti">📊</span><span>Báo cáo</span></a>
      <a href="#/bookset" data-tab="bookset" data-zone="book"><span class="ti">⚙️</span><span>Cài đặt</span></a>
      <!-- v7.79: dòng nhỏ dưới cùng ở Tổng quan: lần tự động đồng bộ Google Sheets gần nhất -->
      <div class="gs-foot" id="gs-foot" hidden></div>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Ứng dụng cần bật JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
